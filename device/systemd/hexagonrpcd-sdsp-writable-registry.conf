# The sensor DSP needs to save its registry, otherwise it does not bring up
# the accelerometer. Serve a writable copy as the persist directory.
# (Mobian: the daemon itself, not Debian's /usr/bin/hexagonrpcd wrapper)
[Service]
ExecStart=
ExecStart=/usr/libexec/hexagonrpc/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -w /var/lib/hexagonrpcd/sensors-registry
