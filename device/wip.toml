# OnePlus 8 Pro (instantnoodlep), SM8250 - values from the pmOS deviceinfo
chipset = "sm8250"

[bootimg]
version = 2
base = 0x0
kernel = 0x8000
ramdisk = 0x1000000
second = 0x0
tags = 0x100
dtb = 0x1f00000
pagesize = 4096

[[device]]
vendor = "oneplus"
model = "instantnoodlep"
append = "clk_ignore_unused pd_ignore_unused cma=256M firmware_class.path=/lib/firmware/postmarketos"
